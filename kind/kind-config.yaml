# kind cluster for the OBI POC: 1 control-plane + 2 workers.
# All 3 "nodes" are Docker containers that share ONE kernel (the WSL2 VM kernel),
# which is the kernel OBI's eBPF programs will load into.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: obi-poc
nodes:
  - role: control-plane
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    # NodePorts are reachable on every node; we expose them via the control-plane container.
    extraPortMappings:
      - containerPort: 30300   # Grafana NodePort (Phase 4)
        hostPort: 3000
        listenAddress: "127.0.0.1"
      - containerPort: 30080   # shop frontend NodePort (Phase 3)
        hostPort: 8080
        listenAddress: "127.0.0.1"
  - role: worker
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
  - role: worker
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
