{{- $r := .Values.redis -}}
{{- $ctx := dict "name" "redis" "root" $ -}}
# POC: no persistence (no RDB/AOF), small maxmemory.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: {{- include "shop.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels: {{- include "shop.labels" $ctx | nindent 8 }}
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ $r.node }}
      containers:
        - name: redis
          image: {{ $r.image }}
          args: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "32mb", "--maxmemory-policy", "noeviction"]
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 10
          resources: {{- toYaml $r.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: {{- include "shop.labels" $ctx | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - { name: redis, port: 6379, targetPort: redis }
