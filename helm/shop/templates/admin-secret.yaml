{{- /*
Admin login for /admin (frontend) and loadgen's restock call.
Password: .Values.admin.password if set; otherwise keep the one already in the
cluster (lookup); otherwise generate a random one on first install.
*/ -}}
{{- $pw := .Values.admin.password -}}
{{- if not $pw -}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace "shop-admin" -}}
  {{- if $existing -}}
    {{- $pw = index $existing.data "password" | b64dec -}}
  {{- else -}}
    {{- $pw = randAlphaNum 16 -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: shop-admin
  labels: {{- include "shop.labels" (dict "name" "shop-admin" "root" $) | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.admin.user | quote }}
  password: {{ $pw | quote }}
