# grafana-community/tempo 3.2.1 (Tempo 3.1.1), monolithic / single binary.
# (The old grafana/tempo chart moved to grafana-community after 2026-01-30.)
tempo:
  repository: grafana/tempo
  tag: "3.1.1"
  reportingEnabled: false        # no usage stats to Grafana Labs
  retention: 2h                  # laptop: keep traces 2 hours
  # The Collector sends OTLP/gRPC. The chart's default Jaeger receivers stay on:
  # its Service template requires them (setting jaeger: null breaks rendering). Idle ports, no cost.
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"
  metricsGenerator:
    enabled: false               # Phase 6 decides how we build the service graph
  # Phase 6: with cpu limit 500m, heavy trace queries made /ready time out -> liveness probe
  # killed Tempo (exit 137, CPU throttled). Higher ceiling; requests stay small.
  resources:
    requests: { cpu: 20m, memory: 128Mi }
    limits:   { cpu: 1000m, memory: 768Mi }

# no persistence = emptyDir (traces lost on pod restart; fine for a POC)
persistence:
  enabled: false
